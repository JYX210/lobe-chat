name: Deploy to Vercel

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lobe_chat
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js, pnpm and bun
        uses: ./.github/actions/setup-env

      - name: Run database migrations (production)
        run: |
          mkdir -p /tmp/mig && cd /tmp/mig && npm init -y --quiet >/dev/null 2>&1 && npm install pg --quiet 2>&1 | tail -1
          NODE_PATH=/tmp/mig/node_modules node -e "
          const { Client } = require('pg');
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          client.connect().then(() => {
            return client.query('ALTER TABLE users ADD COLUMN IF NOT EXISTS agent_onboarding jsonb;');
          }).then(res => {
            console.log('Migration OK:', res.command);
            return client.end();
          }).catch(e => { console.error(e); process.exit(1); });
          "
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Build and deploy
        run: |
          npx vercel build --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
          DEPLOY_URL=$(npx vercel deploy --prebuilt --prod --yes --archive=tgz --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 | grep -o 'https://[^ ]*\.vercel\.app' | head -1)
          echo "Deployed to: $DEPLOY_URL"
        env:
          KEY_VAULTS_SECRET: ${{ secrets.KEY_VAULTS_SECRET }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lobe_chat
          DATABASE_DRIVER: node
          NEXT_PUBLIC_APP_URL: https://jyxlobe.duckdns.org
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
